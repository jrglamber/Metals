name: XAG live open basket R read-only acceptance
on:
  push:
    branches: [feature/xag-live-basket-r-tile-20261118]
  pull_request:
    paths:
      - 'metals_xag_live_basket_r.py'
      - 'metals_reporting_snapshot.py'
      - 'metals_xag_live_wording_entrypoint.py'
      - 'metals_live_open_pnl_display.py'
      - 'test_metals_xag_live_basket_r.py'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile reporting and dashboard changes
        run: python -m py_compile metals_xag_live_basket_r.py metals_reporting_snapshot.py metals_xag_live_wording_entrypoint.py metals_live_open_pnl_display.py
      - name: Pure broker ownership and R tests
        run: python -m unittest -v test_metals_xag_live_basket_r test_metals_live_open_pnl_display
