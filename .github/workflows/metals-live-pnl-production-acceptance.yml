name: LIVE Metals PnL Production Acceptance
on:
  pull_request:
    paths:
      - '.github/workflows/metals-live-pnl-production-acceptance.yml'
  push:
    branches:
      - recovery-pre-analysis-contract-20261010
    paths:
      - 'metals_live_open_pnl_display.py'
      - 'metals_combined_observed_hwm.py'
      - 'metals_xag_live_wording_entrypoint.py'
      - '.github/workflows/metals-live-pnl-production-acceptance.yml'
  workflow_dispatch:
jobs:
  verify:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify public broker-verified combined PnL, peak and Hub reconciliation
        env:
          METALS_URL: https://metals-production-bb81.up.railway.app
          HUB_URL: https://project-exit-plan-portfolio-hub-production.up.railway.app
        run: |
          python - <<'PY'
          import json, math, os, time, urllib.request, urllib.error
          def get(url):
              req=urllib.request.Request(url,headers={"Accept":"application/json","User-Agent":"Metals-PnL-Production-Acceptance/1.0"})
              with urllib.request.urlopen(req,timeout=20) as resp:
                  if resp.status != 200: raise AssertionError(f"{url}: HTTP {resp.status}")
                  return json.load(resp)
          reason = ""
          for attempt in range(4):
              try:
                  m=get(os.environ["METALS_URL"]+"/api/live-metals-open-pnl")
                  if m.get("ok") is not True:
                      raise AssertionError("Metals PnL producer unavailable: "+str(m.get("reason")))
                  if m.get("high_water_status")!="OBSERVED_COMBINED_LIVE":
                      raise AssertionError("Combined observed high-water unavailable: "+str(m.get("high_water_error")))
                  peak=float(m["high_water_gbp"]); observed=float(m["open_pnl_gbp"])
                  give=float(m["giveback_gbp"])
                  if peak+0.01<observed or abs(give-max(0,peak-observed))>0.02:
                      raise AssertionError("Combined Metals peak/giveback does not reconcile")
                  if not m.get("high_water_tracking_started_at_utc") or not m.get("high_water_at_utc"):
                      raise AssertionError("Combined Metals peak timestamps missing")
                  h=get(os.environ["HUB_URL"]+"/api/aggregate")
                  metals=((h.get("sources") or {}).get("metals") or {}).get("data") or {}
                  hb=metals.get("basket") or {}
                  hp=metals.get("live_metals_positions") or {}
                  if hp.get("ok") is not True or hb.get("live_positions_status")!="BROKER_VERIFIED":
                      raise AssertionError("Hub's combined broker PnL is unverified")
                  mp=float(m["open_pnl_gbp"]); hpn=float(hb["pnl_gbp"])
                  if not math.isfinite(mp) or not math.isfinite(hpn):
                      raise AssertionError("Nonfinite broker PnL")
                  if int(m["open_count"]) != int(hb["open_trades"]):
                      raise AssertionError("Metals and Hub open trade counts differ")
                  if int(m["xau_count"]) != int(hb["live_xau_open_count"]):
                      raise AssertionError("Metals and Hub XAU ownership differs")
                  if int(m["xag_short_count"]) != int(hb["live_xag_short_open_count"]):
                      raise AssertionError("Metals and Hub XAG ownership differs")
                  if abs(float(m["xau_open_pnl_gbp"])+float(m["xag_short_open_pnl_gbp"])-mp)>0.01:
                      raise AssertionError("Metals XAU+XAG sum differs from headline")
                  if abs(float(hp["open_pnl_gbp"])-hpn)>0.01:
                      raise AssertionError("Hub positions differ from headline")
                  delta=abs(mp-hpn)
                  print(f"Attempt {attempt+1}: Metals £{mp:.2f}, Hub £{hpn:.2f}, delta £{delta:.2f}, trades {m['open_count']}")
                  if delta<=2.00:
                      print("PASS: live Metals PnL verified and consistent with Hub within £2 near-simultaneous quote tolerance")
                      break
                  reason=f"Open PnL delta £{delta:.2f} exceeds near-simultaneous tolerance"
              except Exception as exc:
                  reason=f"{type(exc).__name__}: {exc}"
                  print("Attempt failed: "+reason)
              time.sleep(3)
          else:
              raise SystemExit("FAIL: "+reason)
          PY
