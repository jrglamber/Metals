name: Metals forward economic and funding research capture tests
on:
  push:
    branches: [recovery-pre-analysis-contract-20261010]
    paths:
      - 'metals_forward_economic_capture.py'
      - 'test_metals_forward_economic_capture.py'
      - 'metals_live_analysis_export.py'
      - 'test_metals_live_analysis_export.py'
      - 'metals_xag_live_wording_entrypoint.py'
      - '.github/workflows/metals-forward-economic-capture-tests.yml'
  workflow_dispatch:
jobs:
  research-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test capture and zero execution authority
        run: |
          python -m py_compile metals_forward_economic_capture.py test_metals_forward_economic_capture.py metals_live_analysis_export.py test_metals_live_analysis_export.py
          python -m unittest -v test_metals_forward_economic_capture test_metals_live_analysis_export
