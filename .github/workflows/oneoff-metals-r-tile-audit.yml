name: One-off Metals XAU R source diagnostic
on:
  push:
    branches: [main]
    paths: ['.github/workflows/oneoff-metals-r-tile-audit.yml']
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect reporting R scope read-only
        run: |
          python - <<'PY'
          import json,urllib.request
          urls=[("metals","https://metals-production-bb81.up.railway.app/api/portfolio-summary"),("hub","https://project-exit-plan-portfolio-hub-production.up.railway.app/api/aggregate")]
          for label,url in urls:
            try:
              req=urllib.request.Request(url,headers={"Accept":"application/json","User-Agent":"Metals-XAU-R-Check/1.0"})
              with urllib.request.urlopen(req,timeout=20) as r:
                obj=json.load(r)
              if label=="hub":
                obj=(((obj.get("sources") or {}).get("metals") or {}).get("data") or {})
              b=obj.get("basket") or {}
              print(label,"fields",json.dumps({k:b.get(k) for k in ("pnl_r","high_water_r","giveback_r","xau_only_pnl_r","xau_only_high_water_r","xau_only_giveback_r","open_trades","high_water_gbp","xau_only_high_water_gbp","pnl_gbp","live_positions_status","combined_high_water_status")},default=str))
              print(label,"basket_keys",[k for k in b.keys() if k.endswith("_r") or "r_level" in k])
            except Exception as e: print(label,"ERROR",type(e).__name__,str(e)[:140])
          PY
