name: Observer outcome health syntax
on:
  pull_request:
    paths:
      - observer_outcome_health.py
      - '*entrypoint.py'
      - .github/workflows/observer-outcome-health.yml
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile observer_outcome_health.py
