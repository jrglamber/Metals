name: Metals AI observer read-only diagnostic
on:
  push:
    paths:
      - '.github/workflows/metals-ai-diagnostic.yml'
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check observer without revealing trade data or prompts
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request, json, csv, io, collections
          BASE='https://metals-production-bb81.up.railway.app'
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'PEP-monitor/1.0'}),timeout=20) as r:
                  return r.read().decode('utf-8')
          try:
              d=json.loads(get(BASE+'/api/ai-observer/status'))
              print('STATUS',json.dumps({k:d.get(k) for k in ('ok','alerts','capture_age_hours','latest_complete_age_hours','latest_eligible_age_hours','error_count_recent_100','overdue_eligible_count','ai_enabled','api_key_configured','model','thread_alive','worker_started','counts')},default=str))
          except Exception as e: print('STATUS_ERROR',type(e).__name__,str(e)[:100])
          try:
              rows=list(csv.DictReader(io.StringIO(get(BASE+'/export/ai-regime-observer.csv?limit=150'))))
              print('EXPORT_TOTAL',len(rows),'STATUS_COUNTS',dict(collections.Counter(r.get('status') for r in rows)))
              for r in rows[:25]:
                  stamp=r.get('updated_at_utc') or r.get('created_at_utc') or ''
                  err=r.get('error') or ''
                  code=r.get('last_http_status') or ''
                  error_kind='HTTP '+str(code) if str(code) not in ('','0','None') else (err.split(':',1)[0][:32] if err else '')
                  print('ROW',r.get('status'),r.get('api_eligible'),stamp[:16],error_kind)
              error_types=collections.Counter()
              for r in rows:
                  if r.get('status') in ('ERROR','RETRY_WAIT'):
                      code=r.get('last_http_status') or ''
                      err=r.get('error') or ''
                      error_types['HTTP_'+code if code and code!='0' else 'OTHER_'+err.split(':',1)[0][:32]] += 1
              print('RECENT_ERROR_TYPES',dict(error_types))
          except Exception as e: print('EXPORT_ERROR',type(e).__name__,str(e)[:100])
          PY
