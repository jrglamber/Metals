name: XAG NAV entry risk budget
on:
  push:
    paths:
      - metals_xag_nav_risk_override.py
      - metals_xag_live_wording_entrypoint.py
      - tests/test_xag_nav_risk_budget.py
      - .github/workflows/xag-nav-risk-tests.yml
  pull_request:
    paths:
      - metals_xag_nav_risk_override.py
      - metals_xag_live_wording_entrypoint.py
      - tests/test_xag_nav_risk_budget.py
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check syntax
        run: python -m py_compile metals_xag_nav_risk_override.py metals_xag_live_wording_entrypoint.py
      - name: Test NAV limit and capacity recycling
        run: python -m unittest discover -s tests -p 'test_xag_nav_risk_budget.py' -v
