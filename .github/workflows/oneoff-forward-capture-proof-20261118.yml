name: One-off forward Metals capture verification
on:
  push:
    branches: [main]
    paths: ['.github/workflows/oneoff-forward-capture-proof-20261118.yml']
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check live samples, capture health and verified broker inputs
        run: |
          python - <<'PY'
          import urllib.request,json,time,io,zipfile,csv
          BASE='https://metals-production-bb81.up.railway.app'
          def get(path):
            with urllib.request.urlopen(urllib.request.Request(BASE+path,headers={'User-Agent':'Metals-ReadOnly-Research-Verification/1.0'}),timeout=45) as r:
              return r.read(15000000)
          for i in range(2):
            try:
              health=json.loads(get('/api/metals-forward-economic-research/status'))
              print("STATUS",json.dumps({k:health.get(k) for k in ('thread_alive','sample_count_since_start','last_status','last_error_class','last_sample_at_utc','last_complete_at_utc','last_economic_gbp','last_xag_funding_proxy_r','broker_order_writes','execution_authority')}))
              payload=get('/export/metals-live-analysis.zip')
              with zipfile.ZipFile(io.BytesIO(payload)) as z:
                manifest=json.loads(z.read('manifest.json'))
                print('MANIFEST',json.dumps(manifest.get('forward_capture'),default=str))
                names=z.namelist()
                if 'live-metals-forward-economic-equity.csv' in names:
                  r=list(csv.DictReader(io.TextIOWrapper(z.open('live-metals-forward-economic-equity.csv'),encoding='utf-8-sig')))
                  print('LATEST_ROW',json.dumps({k:r[-1].get(k) for k in ('sampled_at_utc','status','reason','xag_open_count','xag_campaign_entries','xag_open_r','xag_banked_r_proxy','xag_funding_r_proxy','xag_funding_status','combined_open_pnl_gbp','combined_realised_since_epochs_gbp','economic_equity_gbp','economic_high_water_gbp','economic_giveback_gbp','mark_to_market_complete','broker_population_matched','cash_broker_verified')}) if r else 'NO_ROWS')
                  if r:
                    import ast
                    print('MARK_COUNT',len(json.loads(r[-1].get('position_marks_json') or '[]')))
              if i==0:time.sleep(12)
            except Exception as e:
              print('CHECK_FAILED',type(e).__name__,str(e)[:200])
          PY
